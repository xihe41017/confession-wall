<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/logo.jpg" type="image/jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffeaf2" />
    <title>平和一中校园墙</title>
    <style>
      /* 首屏启动页样式（内联，保证立即渲染） */
      html, body { margin: 0; padding: 0; height: 100%; background: #fff6f9; }
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: linear-gradient(160deg, #fff0f6 0%, #ffe1ee 55%, #ffd3e6 100%);
        transition: opacity 0.6s ease, visibility 0.6s ease;
      }
      #splash.splash-out { opacity: 0; visibility: hidden; }
      .splash-inner { text-align: center; padding: 0 24px; animation: splashIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) both; }
      .splash-logo {
        width: 150px; height: 150px; border-radius: 50%;
        object-fit: cover; display: block; margin: 0 auto 18px;
        box-shadow: 0 14px 44px rgba(214, 94, 140, 0.35), 0 0 0 6px rgba(255,255,255,0.7);
        animation: logoFloat 3s ease-in-out infinite;
      }
      .splash-name { font-size: 26px; font-weight: 800; color: #c21f4e; letter-spacing: 6px; }
      .splash-sub { font-size: 13px; color: #b98a9d; margin-top: 8px; letter-spacing: 2px; }
      .splash-bar { width: 180px; height: 4px; border-radius: 99px; background: rgba(255,255,255,0.7); margin: 22px auto 0; overflow: hidden; }
      .splash-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #e5486f, #ff8fb0); border-radius: 99px; transition: width 0.3s ease; }
      @keyframes splashIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
      @keyframes logoFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="splash-inner">
        <img src="/logo.jpg" alt="校徽" class="splash-logo" id="splashLogo" />
        <div class="splash-name" id="splashName">平和一中校园墙</div>
        <div class="splash-sub">把想说的话 · 写在这里</div>
        <div class="splash-bar"><div class="splash-bar-fill"></div></div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
